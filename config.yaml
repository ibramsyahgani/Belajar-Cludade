    primary: '#1F3A5F'
    accent: '#4A6FA5'
  agrikultur:
    primary: '#2E5E3A'
    accent: '#6B8E5A'
  psikologi_hr:
    primary: '#5B3A6E'
    accent: '#8E6BA5'
  logistik:
    primary: '#7A4A1F'
    accent: '#B5824A'
  hse_esg:
    primary: '#1F5F5B'
    accent: '#4AA59E'

docx_style:
  font_name: Calibri
  font_size: 10
  name_size: 16
  heading_size: 11
  margin_cm: 2.5
